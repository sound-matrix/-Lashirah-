name: Deploy Lashirah to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lashirah-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy over FTPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Validate PHP
        run: |
          php -l gallery.php
          php -l cms/library.php
          php -l admin/index.php
          php -l admin/config.example.php

      - name: Verify Hostinger credentials configured
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Configure HOSTINGER_FTP_HOST, HOSTINGER_FTP_USER and HOSTINGER_FTP_PASSWORD under GitHub Actions secrets."
            exit 1
          fi

      # Use a dedicated Hostinger FTP account with its root mapped to public_html.
      # Prevent deletion/overwrite of client-managed uploads, CMS data and credentials.
      - name: Upload website to Hostinger (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ./
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.DS_Store
            **/README.md
            **/HOSTINGER-ADMIN-SETUP.md
            **/.gitignore
            **/admin/config.local.php
            **/storage/gallery.json
            **/uploads/gallery/*.jpg
            **/uploads/gallery/*.jpeg
            **/uploads/gallery/*.png
            **/uploads/gallery/*.webp
            **/uploads/gallery/*.gif
            **/uploads/gallery/*.php
            **/uploads/gallery/*.phtml
