name: Deploy Lashirah to Hostinger
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lashirah-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy over SSH
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SSH_HOST: 82.25.107.62
      SSH_PORT: '65002'
      SSH_USER: u419719929
      SSH_TARGET_PATH: /home/u419719929/domains/lashirah.com/public_html
      SSH_ED25519_FINGERPRINT: 'SHA256:sxb45CEQcolp6ddRf4NNDG9v5XgeeAxS2bxRUJBYMkc'
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Validate PHP
        run: |
          php -l gallery.php
          php -l cms/library.php
          php -l admin/index.php
          php -l admin/config.example.php

      - name: Verify deployment key secret
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Add the HOSTINGER_SSH_PRIVATE_KEY GitHub Actions secret (private key generated for lashirah-github-deploy)."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Verify Hostinger SSH host fingerprint
        run: |
          set -euo pipefail
          # Verify against the ED25519 fingerprint published in Hostinger's SSH Access panel.
          # Never trust an unverified ssh-keyscan result.
          ssh-keyscan -T 15 -p "$SSH_PORT" -t ed25519 "$SSH_HOST" > ~/.ssh/known_hosts
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::Could not fetch Hostinger SSH ED25519 host key."
            exit 1
          fi
          actual="$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '$4 == "(ED25519)" {print $2;exit}')"
          if [ "$actual" != "$SSH_ED25519_FINGERPRINT" ]; then
            echo "::error::SSH host key does not match the fingerprint verified in Hostinger hPanel."
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Verify remote document root and rsync availability
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "test -d '$SSH_TARGET_PATH' && test -w '$SSH_TARGET_PATH' && command -v rsync >/dev/null"

      - name: Deploy website files without deleting client content
        run: |
          rsync -az --no-perms --no-owner --no-group \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.gitignore' \
            --exclude='/README.md' \
            --exclude='/HOSTINGER-ADMIN-SETUP.md' \
            --exclude='/HOSTINGER-SECURE-DEPLOY.md' \
            --exclude='/admin/config.local.php' \
            --exclude='/storage/gallery.json' \
            --exclude='/storage/site.json' \
            --exclude='/storage/media.css' \
            --exclude='/uploads/gallery/*.jpg' \
            --exclude='/uploads/gallery/*.jpeg' \
            --exclude='/uploads/gallery/*.png' \
            --exclude='/uploads/gallery/*.webp' \
            --exclude='/uploads/gallery/*.gif' \
            --exclude='/uploads/gallery/*.php' \
            --exclude='/uploads/gallery/*.phtml' \
            -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:${SSH_TARGET_PATH%/}/"
