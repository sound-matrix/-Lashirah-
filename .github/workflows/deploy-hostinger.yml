name: Deploy Lashirah to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lashirah-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy over SSH
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Validate PHP
        run: |
          php -l gallery.php
          php -l cms/library.php
          php -l admin/index.php
          php -l admin/config.example.php

      - name: Verify SSH configuration
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
          SSH_TARGET_PATH: ${{ secrets.HOSTINGER_SSH_TARGET_PATH }}
        run: |
          for name in SSH_HOST SSH_USER SSH_PORT SSH_PRIVATE_KEY SSH_KNOWN_HOSTS SSH_TARGET_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing HOSTINGER_${name} repository secret. Configure Hostinger SSH access before deploying."
              exit 1
            fi
          done
          if ! [[ "$SSH_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::HOSTINGER_SSH_PORT must be numeric."
            exit 1
          fi
          if ! [[ "$SSH_TARGET_PATH" == /* ]] || [[ "$SSH_TARGET_PATH" == *'..'* ]]; then
            echo "::error::HOSTINGER_SSH_TARGET_PATH must be an absolute server path without '..'."
            exit 1
          fi

      - name: Configure verified SSH host and deployment key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify target folder exists
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_TARGET_PATH: ${{ secrets.HOSTINGER_SSH_TARGET_PATH }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "test -d '$SSH_TARGET_PATH' && test -w '$SSH_TARGET_PATH'"

      - name: Deploy changed website files, preserve uploaded content
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_TARGET_PATH: ${{ secrets.HOSTINGER_SSH_TARGET_PATH }}
        run: |
          rsync -az --no-perms --no-owner --no-group \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.gitignore' \
            --exclude='/README.md' \
            --exclude='/HOSTINGER-ADMIN-SETUP.md' \
            --exclude='/admin/config.local.php' \
            --exclude='/storage/gallery.json' \
            --exclude='/uploads/gallery/*.jpg' \
            --exclude='/uploads/gallery/*.jpeg' \
            --exclude='/uploads/gallery/*.png' \
            --exclude='/uploads/gallery/*.webp' \
            --exclude='/uploads/gallery/*.gif' \
            --exclude='/uploads/gallery/*.php' \
            --exclude='/uploads/gallery/*.phtml' \
            -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:${SSH_TARGET_PATH%/}/"
